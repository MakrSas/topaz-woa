name: Build drivers

on:
  push:
    paths:
      - "drivers/**"
      - "tools/audio/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build drivers (ARM64 Release)
        run: |
          msbuild drivers\TopazTouch\TopazTouch.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazTouch build failed" }
          msbuild drivers\TopazBattery\TopazBattery.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazBattery build failed" }
          msbuild drivers\TopazDisplay\TopazDisplay.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazDisplay build failed" }
          msbuild drivers\TopazButtons\TopazButtons.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazButtons build failed" }
          msbuild drivers\TopazModem\TopazModem.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazModem build failed" }
          msbuild drivers\TopazWifi\TopazWifi.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazWifi build failed" }
          msbuild drivers\TopazCpu\TopazCpu.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazCpu build failed" }
          msbuild drivers\TopazRpm\TopazRpm.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazRpm build failed" }
          msbuild drivers\TopazBacklight\TopazBacklight.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazBacklight build failed" }
          msbuild drivers\TopazGpu\TopazGpu.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazGpu build failed" }
          msbuild drivers\TopazGpuW\TopazGpuW.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazGpuW build failed" }
          msbuild drivers\TopazAudio\TopazAudio.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazAudio build failed" }
          msbuild drivers\TopazSpeaker\TopazSpeaker.vcxproj /p:Configuration=Release /p:Platform=ARM64 /p:ApiValidator_Enable=false /m /v:minimal
          if ($LASTEXITCODE) { throw "TopazSpeaker build failed" }

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Build tgputest (user-mode TopazGpuW check)
        shell: pwsh
        run: |
          $inc = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          New-Item -ItemType Directory -Force out\tgputest | Out-Null
          cl /nologo /O2 /W3 /I "$inc\km" tools\gputest\tgputest.c /Fe:out\tgputest\tgputest.exe gdi32.lib
          if ($LASTEXITCODE) { throw "tgputest build failed" }
          cl /nologo /O2 /W3 /EHsc tools\gputest\d3dtest.cpp /Fe:out\tgputest\d3dtest.exe d3d11.lib dxgi.lib d3dcompiler.lib
          if ($LASTEXITCODE) { throw "d3dtest build failed" }

      - name: Build taudio (TopazAudio lab tool)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out\taudio | Out-Null
          cl /nologo /O2 /W3 tools\audio\taudio.c /Fe:out\taudio\taudio.exe
          if ($LASTEXITCODE) { throw "taudio build failed" }
          cl /nologo /O2 /W3 /EHsc tools\audio\wasapitest.cpp /Fe:out\taudio\wasapitest.exe ole32.lib
          if ($LASTEXITCODE) { throw "wasapitest build failed" }
          cl /nologo /O2 /W3 /EHsc tools\audio\kstest.cpp /Fe:out\taudio\kstest.exe ksuser.lib
          if ($LASTEXITCODE) { throw "kstest build failed" }

      - name: Package, catalog and test-sign
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $kits = "C:\Program Files (x86)\Windows Kits\10"
          $ver  = "10.0.26100.0"
          $bin  = "$kits\bin\$ver"
          $inf2cat = Get-ChildItem "$kits\bin" -Recurse -Filter Inf2Cat.exe | Select-Object -First 1
          $devcon = Get-ChildItem "$kits\Tools" -Recurse -Filter devcon.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -match "arm64" } | Select-Object -First 1
          # Windows on the phone boots with its clock at 2022: keep the cert valid from 2015
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=topaz-woa test signing" -CertStoreLocation Cert:\CurrentUser\My -NotBefore (Get-Date "2015-01-01") -NotAfter (Get-Date "2045-01-01")

          foreach ($name in @("TopazTouch", "TopazBattery", "TopazDisplay", "TopazButtons", "TopazModem", "TopazWifi", "TopazCpu", "TopazRpm", "TopazBacklight", "TopazGpu", "TopazGpuW", "TopazAudio", "TopazSpeaker")) {
            $out = "out\$name"
            New-Item -ItemType Directory -Force $out | Out-Null
            Copy-Item "drivers\$name\ARM64\Release\$name.sys" $out
            Copy-Item "drivers\$name\$name.inf" $out

            & "$bin\x64\stampinf.exe" -f "$out\$name.inf" -d "*" -a "arm64" -v "0.1.${{ github.run_number }}.0" -k $(if ($name -eq "TopazSpeaker") { "1.31" } else { "1.15" })
            if ($LASTEXITCODE) { throw "stampinf $name failed" }
            & $inf2cat.FullName /driver:"$((Resolve-Path $out).Path)" /os:10_NI_ARM64 /uselocaltime
            if ($LASTEXITCODE) { throw "inf2cat $name failed" }

            Export-Certificate -Cert $cert -FilePath "$out\topaz-woa-test.cer" | Out-Null
            & "$bin\x64\signtool.exe" sign /fd sha256 /sha1 $cert.Thumbprint /s My "$out\$name.sys" "$out\$name.cat"
            if ($LASTEXITCODE) { throw "signtool $name failed" }

            if ($devcon) { Copy-Item $devcon.FullName $out } else { Write-Warning "devcon arm64 not found" }
            Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize
          }

      - uses: actions/upload-artifact@v4
        with:
          name: TopazTouch-arm64
          path: out/TopazTouch

      - uses: actions/upload-artifact@v4
        with:
          name: TopazBattery-arm64
          path: out/TopazBattery

      - uses: actions/upload-artifact@v4
        with:
          name: TopazDisplay-arm64
          path: out/TopazDisplay

      - uses: actions/upload-artifact@v4
        with:
          name: TopazButtons-arm64
          path: out/TopazButtons

      - uses: actions/upload-artifact@v4
        with:
          name: TopazModem-arm64
          path: out/TopazModem

      - uses: actions/upload-artifact@v4
        with:
          name: TopazWifi-arm64
          path: out/TopazWifi

      - uses: actions/upload-artifact@v4
        with:
          name: TopazCpu-arm64
          path: out/TopazCpu

      - uses: actions/upload-artifact@v4
        with:
          name: TopazRpm-arm64
          path: out/TopazRpm

      - uses: actions/upload-artifact@v4
        with:
          name: TopazBacklight-arm64
          path: out/TopazBacklight

      - uses: actions/upload-artifact@v4
        with:
          name: TopazGpu-arm64
          path: out/TopazGpu

      - uses: actions/upload-artifact@v4
        with:
          name: TopazGpuW-arm64
          path: |
            out/TopazGpuW
            out/tgputest

      - uses: actions/upload-artifact@v4
        with:
          name: TopazAudio-arm64
          path: |
            out/TopazAudio
            out/taudio

      - uses: actions/upload-artifact@v4
        with:
          name: TopazSpeaker-arm64
          path: out/TopazSpeaker
