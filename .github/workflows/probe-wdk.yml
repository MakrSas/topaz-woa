name: Probe WDK (WiFiCx)

# One-off helper: copies the WiFiCx / NetAdapterCx / WDI TLV headers of the runner's WDK into an
# artifact so the driver can be written against the exact definitions. Not part of the build.
on:
  push:
    paths:
      - ".github/workflows/probe-wdk.yml"

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Collect headers
        shell: pwsh
        run: |
          $inc = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          $out = "wdkhdr"
          New-Item -ItemType Directory -Force $out | Out-Null
          $dirs = @("km\wificx\1.0", "km\wificx\1.2", "km\wlan\2.0", "km\netcx\kmdf\adapter\2.2", "km\netcx\shared\1.0", "km\netcx\kmdf\adapter\2.5")
          foreach ($d in $dirs) {
            if (Test-Path "$inc\$d") { New-Item -ItemType Directory -Force "$out\$d" | Out-Null; Copy-Item "$inc\$d\*" "$out\$d\" -Recurse }
          }
          Get-ChildItem "$inc\km\netcx" -Recurse -Directory | ForEach-Object { $_.FullName.Substring($inc.Length) }
          foreach ($f in @("km\dot11wificxintf.h", "km\dot11wificxtypes.hpp", "km\windot11.h", "shared\wlantypes.h", "km\ndis\types.h", "shared\ntddndis.h")) {
            if (Test-Path "$inc\$f") { New-Item -ItemType Directory -Force (Split-Path "$out\$f") | Out-Null; Copy-Item "$inc\$f" "$out\$f" }
          }
          Get-ChildItem $out -Recurse -File | Measure-Object -Property Length -Sum
      - uses: actions/upload-artifact@v4
        with:
          name: wdk-wificx-headers
          path: wdkhdr
