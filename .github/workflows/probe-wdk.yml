name: Probe WDK (NetAdapter rings)

# One-off helper: copies the NetAdapterCx ring/packet/extension headers of the runner's WDK into an
# artifact so the data path can be written against the exact definitions. Not part of the build.
on:
  push:
    paths:
      - ".github/workflows/probe-wdk.yml"

jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Collect headers
        shell: pwsh
        run: |
          $inc = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.26100.0"
          $out = "wdkhdr"
          New-Item -ItemType Directory -Force $out | Out-Null
          $names = @("ring.h","ringcollection.h","packet.h","fragment.h","virtualaddress.h","virtualaddresstypes.h","logicaladdress.h","extension.h","exemptionaction.h","exemptionactiontypes.h","checksum.h","packetextension*.h","*wifi*.h")
          Get-ChildItem $inc -Recurse -Include $names -ErrorAction SilentlyContinue | ForEach-Object {
            $rel = $_.FullName.Substring($inc.Length + 1)
            Write-Host $rel
            $dst = Join-Path $out $rel
            New-Item -ItemType Directory -Force (Split-Path $dst) | Out-Null
            Copy-Item $_.FullName $dst
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wdk-net-headers
          path: wdkhdr
